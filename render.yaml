envVarGroups:
  - name: titli-internal
    envVars:
      - key: CRON_SECRET
        generateValue: true

services:
  - type: web
    name: titli-news
    runtime: node
    plan: starter
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile && env DATABASE_PATH=/tmp/titli-build.db pnpm --filter web db:migrate && env DATABASE_PATH=/tmp/titli-build.db pnpm --filter web build:production
    startCommand: pnpm --filter web start:production
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - fromGroup: titli-internal
      - key: NODE_VERSION
        value: "22"
      - key: STORAGE_ROOT
        value: /var/data
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      # Optional — enables AI-assisted drafting in the admin inbox. Without it,
      # editors draft manually and the publish originality gate still applies.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
    disk:
      name: titli-data
      mountPath: /var/data
      sizeGB: 1

  - type: cron
    name: titli-morning-ingest
    runtime: node
    plan: starter
    region: singapore
    schedule: "0 0 * * *"
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: node scripts/run-morning-ingest.mjs
    envVars:
      - fromGroup: titli-internal
      - key: TITLI_WEB_HOST
        fromService:
          type: web
          name: titli-news
          property: hostport

  - type: cron
    name: titli-edition-publish
    runtime: node
    plan: starter
    region: singapore
    schedule: "30 1 * * *"
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: node scripts/run-scheduled-publish.mjs
    envVars:
      - fromGroup: titli-internal
      - key: TITLI_WEB_HOST
        fromService:
          type: web
          name: titli-news
          property: hostport
